name = "wedding-dance-academy"
main = "worker.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "dance_academy_db"
database_id = "d1-dance-academy-id-placeholder"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "dance-academy-media"

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "dance_academy_secret_jwt_key_2026"
