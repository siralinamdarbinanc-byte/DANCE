name = "dance"
main = "worker.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dance_academy_db"
database_id = "4bdeeea2-bb10-489e-99b3-51bf78d9b096"

# ---------------------------------------------------------------------------
# CLOUDFLARE R2 STORAGE (اختیاری - فعلاً غیرفعال به دلیل عدم نیاز به کارت پرداخت)
# در آینده برای فعال‌سازی کامل R2 کافی است:
# ۱. دستور زیر را اجرا کنید:
#    npx wrangler r2 bucket create dance-academy-media
# ۲. سه خط زیر را از کامنت خارج کنید:
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "dance-academy-media"
# ---------------------------------------------------------------------------

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "dance_academy_secret_jwt_key_2026"
GITHUB_REPO_OWNER = "siralinamdarbinanc-byte"
GITHUB_REPO_NAME = "DANCE"
GITHUB_BRANCH = "main"
# Note: GITHUB_TOKEN should be configured securely as a secret:
# npx wrangler secret put GITHUB_TOKEN

